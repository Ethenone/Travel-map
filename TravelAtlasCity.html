<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="在浏览器中设置中国城市探索等级，并聚合查看省级探索图。">
  <title>Travel Atlas · 城市探索</title>
  <link rel="icon" type="image/x-icon" href="static/assets/favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&family=Newsreader:ital,wght@0,600;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root{--bg:#0c1017;--panel:#121824;--line:#293141;--muted:#8490a4;--text:#eef2f8;--accent:#8ba3ff;--toolbar:58px;--data:360px;--stats:310px;--l0:#394352;--l1:#aa91d8;--l2:#4fb6e9;--l3:#63c68b;--l4:#e7cb60;--l5:#e36d76}
    *{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:Manrope,"Microsoft YaHei",sans-serif}button,input,select{font:inherit}button{color:inherit}.hidden{display:none!important}
    .topbar{height:var(--toolbar);display:flex;align-items:center;padding:0 16px;border-bottom:1px solid var(--line);background:rgba(13,18,26,.97);gap:14px;position:relative;z-index:1000}.brand{display:flex;align-items:center;gap:10px;min-width:245px}.brand-mark{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(145deg,#879cff,#5d6fc1);box-shadow:0 6px 20px #6076db3b}.brand strong{font-family:Newsreader,serif;font-size:20px;display:block;line-height:18px}.brand small{color:var(--muted);font-size:9px;letter-spacing:.15em;text-transform:uppercase}.toolbar{display:flex;align-items:center;gap:7px;flex:1}.tool-btn,.view-btn,.level-btn{border:1px solid var(--line);background:#171e29;border-radius:8px;cursor:pointer;transition:.18s}.tool-btn{height:34px;padding:0 12px;display:flex;align-items:center;gap:7px;font-size:12px;text-decoration:none}.tool-btn:hover{border-color:#48546a;background:#202838}.tool-btn.primary{background:#eef2f8;color:#121722;border-color:#eef2f8;font-weight:700}.tool-btn.template-cta{color:#17120a;background:linear-gradient(135deg,#ffe49b,#ffc66d);border-color:#ffd98e;font-weight:800}.tool-btn.danger{color:#ff9aa4;border-color:#713640;background:#24171c}.tool-btn.danger:hover{color:#fff;background:#7c303c;border-color:#bd5967}.tool-btn.github-link{color:#dce2ec;text-decoration:none}.tool-btn.github-link:hover{color:#fff}.page-tabs{display:flex;align-items:center;flex:none;padding:3px;gap:3px;border:1px solid #344056;border-radius:10px;background:#0f151f;box-shadow:0 5px 18px #0003}.page-tab{height:28px;padding:0 11px;display:flex;align-items:center;gap:6px;border-radius:7px;color:#aeb9ca;text-decoration:none;font-size:11px;font-weight:700;white-space:nowrap}.page-tab:hover{color:#fff;background:#222c3d}.page-tab.active{color:#10202b;background:linear-gradient(135deg,#a8f3ec,#64d7cf);box-shadow:0 4px 12px #4dd7d033}.toolbar-spacer{flex:1}.privacy{font-size:10px;color:var(--muted);display:flex;gap:6px;align-items:center}.privacy i{color:#62d99b}
    .workspace{height:calc(100% - var(--toolbar));min-height:0;display:grid;grid-template-columns:var(--data) minmax(420px,1fr) var(--stats)}.panel{height:100%;min-width:0;min-height:0;overflow:hidden;background:var(--panel);display:flex;flex-direction:column;position:relative;z-index:10}.left-panel{border-right:1px solid var(--line)}.right-panel{border-left:1px solid var(--line)}.panel-head{min-height:68px;padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}.panel-title{min-width:0;flex:1}.panel-title h2{font-size:13px;margin:0 0 3px}.panel-title p{font-size:10px;color:var(--muted);margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .filters{padding:12px;display:grid;grid-template-columns:minmax(0,1fr) 124px;gap:7px;border-bottom:1px solid var(--line)}.input,.select{width:100%;height:34px;border:1px solid #313b4d;border-radius:8px;background:#0f151f;color:#e8edf5;padding:0 10px;font-size:11px;outline:0}.input:focus,.select:focus{border-color:var(--accent)}.select{cursor:pointer}.city-list{flex:1;min-height:0;overflow-y:auto;scrollbar-color:#3b4658 #0d131d;scrollbar-width:thin}.city-row{display:grid;grid-template-columns:minmax(0,1fr) 94px;align-items:center;gap:9px;min-height:50px;padding:7px 12px;border-bottom:1px solid #202837;background:#101620}.city-row:hover,.city-row.active{background:#171f2c}.city-name{min-width:0}.city-name strong{display:block;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.city-name span{display:block;margin-top:2px;color:#69768a;font-size:9px}.city-level{height:29px;border:1px solid #313b4d;border-radius:7px;background:#151c28;color:#dfe5ee;padding:0 6px;font-size:10px;cursor:pointer}.statusbar{height:34px;flex:none;border-top:1px solid var(--line);padding:0 12px;display:flex;align-items:center;justify-content:space-between;font-size:10px;color:var(--muted)}
    .canvas{position:relative;min-width:0;min-height:0;overflow:hidden;isolation:isolate;background:radial-gradient(circle at 50% 42%,#112a40 0,#07111f 48%,#02060b 100%)}.map{position:absolute;inset:0;background:#08101a}.canvas::after{content:"";pointer-events:none;position:absolute;inset:0;box-shadow:inset 0 0 80px #04060999;z-index:500}.canvas-head{position:absolute;top:16px;left:16px;right:16px;z-index:600;display:flex;justify-content:space-between;pointer-events:none}.canvas-label{padding:10px 12px;border:1px solid #30394a;border-radius:10px;background:#101620e8;backdrop-filter:blur(10px);box-shadow:0 8px 28px #0005}.canvas-label small{display:block;color:var(--muted);font-size:8px;letter-spacing:.16em}.canvas-label strong{font-family:Newsreader,serif;font-size:18px}.view-switch{pointer-events:auto;display:flex;padding:4px;gap:3px;border:1px solid #30394a;border-radius:10px;background:#101620ee}.view-btn{border:0;background:transparent;height:29px;padding:0 11px;color:#788499;font-size:10px}.view-btn.active{background:#2a3345;color:#fff}.brush{position:absolute;left:50%;bottom:18px;z-index:600;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:5px;border:1px solid #30394a;border-radius:11px;background:#101620ee;box-shadow:0 10px 30px #0005}.brush-label{padding:0 7px;color:#8190a6;font-size:9px;white-space:nowrap}.level-btn{height:31px;min-width:31px;padding:0 8px;border-color:transparent;color:#dce3ed;font-size:9px;display:flex;align-items:center;gap:5px}.level-btn i{width:8px;height:8px;border-radius:50%;background:var(--c)}.level-btn.active{border-color:var(--c);background:#273040;box-shadow:inset 0 -2px 0 var(--c)}.map-hint{position:absolute;left:16px;bottom:18px;z-index:600;padding:8px 10px;border:1px solid #30394a;border-radius:8px;background:#101620e8;color:#a4afc0;font-size:9px}.leaflet-control-zoom{border:1px solid #30394a!important;border-radius:9px!important;overflow:hidden}.leaflet-control-zoom a{border:0!important;background:#101620e8!important;color:#dbe3ef!important}.leaflet-control-attribution{background:#101620bf!important;color:#8190a6!important}.leaflet-control-attribution a{color:#aebbd1!important}.leaflet-tooltip.city-tip{border:1px solid #3a465a;border-radius:8px;background:#111926;color:#eef2f8;box-shadow:0 8px 24px #0006;font:10px Manrope,sans-serif}.leaflet-tooltip.city-tip:before{border-top-color:#111926}
    .summary-scroll{flex:1;min-height:0;overflow-y:auto;padding:12px;scrollbar-color:#3b4658 #0d131d;scrollbar-width:thin}.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.stat-card{min-height:72px;padding:10px;border:1px solid #252e3e;border-radius:9px;background:linear-gradient(145deg,#171f2c,#141a25)}.stat-card .label{font-size:8px;letter-spacing:.08em;text-transform:uppercase;color:#7e899d}.stat-card .value{font:600 20px Newsreader,serif;margin-top:7px}.stat-card .unit{font:500 8px Manrope,sans-serif;color:#8894a8;margin-left:4px}.section-title{display:flex;align-items:center;gap:8px;margin:18px 0 8px;font-size:10px;color:#aeb8c8;text-transform:uppercase;letter-spacing:.09em}.section-title::after{content:"";height:1px;background:#273040;flex:1}.province-list{border:1px solid #252e3e;border-radius:9px;overflow:hidden}.province-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:9px;align-items:center;min-height:44px;padding:7px 9px;border:0;border-bottom:1px solid #222a38;background:#141a24;color:#e8edf5;text-align:left;cursor:pointer;width:100%}.province-row:last-child{border-bottom:0}.province-row:hover{background:#1b2432}.province-name{font-size:10px}.province-name small{display:block;color:#6f7b90;margin-top:3px}.province-score{font:500 10px "DM Mono",monospace;color:#aeb8c8}.mini-bar{height:3px;background:#273142;margin-top:5px;border-radius:2px;overflow:hidden}.mini-bar span{display:block;height:100%;background:var(--c)}.legend-list{display:grid;grid-template-columns:1fr 1fr;gap:7px}.legend-item{display:flex;align-items:center;gap:7px;padding:7px;border:1px solid #252e3e;border-radius:7px;color:#9aa6b8;font-size:9px}.legend-dot{width:9px;height:9px;border-radius:3px;background:var(--c)}.empty{padding:36px 12px;text-align:center;color:var(--muted);font-size:11px}.toast{position:fixed;top:70px;left:50%;transform:translate(-50%,-14px);z-index:2000;padding:9px 14px;border:1px solid #3d485d;border-radius:9px;background:#1c2432;color:#eef2f8;font-size:11px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1180px){:root{--data:320px;--stats:270px}.brand{min-width:auto}.brand-copy,.privacy{display:none}.level-btn span,.page-tab span{display:none}.page-tab{padding:0 9px}.tool-btn{padding:0 9px}}
    @media(max-width:760px){html,body{overflow:auto}.topbar{position:sticky;top:0}.toolbar .tool-btn span{display:none}.workspace{height:auto;min-height:calc(100vh - var(--toolbar));grid-template-columns:1fr;grid-template-rows:58vh 58vh 520px}.canvas{grid-row:1}.left-panel{grid-row:2;border-right:0;border-top:1px solid var(--line)}.right-panel{grid-row:3;border-left:0;border-top:1px solid var(--line)}.brush{max-width:calc(100% - 24px);overflow-x:auto}.brush-label{display:none}.map-hint{display:none}}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark"><i class="bi bi-map"></i></span><span class="brand-copy"><strong>Travel Atlas</strong><small>City Explorer</small></span></div>
    <nav class="toolbar" aria-label="城市探索工具栏">
      <div class="page-tabs" aria-label="快速模式页面切换"><a class="page-tab" href="TravelAtlas.html"><i class="bi bi-bezier2"></i><span>连线地图</span></a><a class="page-tab active" href="TravelAtlasCity.html" aria-current="page"><i class="bi bi-map-fill"></i><span>城市探索</span></a></div>
      <input id="importFileInput" type="file" accept=".xlsx,.xls,.csv,.json" hidden>
      <button class="tool-btn primary" id="importBtn" type="button"><i class="bi bi-upload"></i><span>一键导入</span></button>
      <button class="tool-btn template-cta" id="downloadTemplateBtn" type="button"><i class="bi bi-file-earmark-spreadsheet"></i><span>下载模板</span></button>
      <button class="tool-btn" id="resetBtn" type="button"><i class="bi bi-arrow-counterclockwise"></i><span>恢复现有记录</span></button>
      <button class="tool-btn danger" id="clearAllBtn" type="button"><i class="bi bi-trash3"></i><span>一键清空</span></button>
      <button class="tool-btn" id="exportBtn" type="button"><i class="bi bi-download"></i><span>导出等级</span></button>
      <a class="tool-btn github-link" href="https://github.com/Ethenone/Travel-map" target="_blank" rel="noopener noreferrer" aria-label="在 GitHub 打开 Travel-map 项目"><i class="bi bi-github"></i><span>GitHub</span></a>
      <div class="toolbar-spacer"></div>
      <span class="privacy"><i class="bi bi-shield-check"></i>修改仅保存在本机浏览器</span>
    </nav>
  </header>
  <div class="workspace">
    <aside class="panel left-panel" aria-label="城市探索等级">
      <div class="panel-head"><div class="panel-title"><h2>城市探索等级</h2><p>在列表选择等级，或使用地图涂色</p></div></div>
      <div class="filters"><input class="input" id="searchInput" type="search" placeholder="搜索城市" aria-label="搜索城市"><select class="select" id="provinceFilter" aria-label="筛选省份"><option value="">全部省份</option></select></div>
      <div class="city-list" id="cityList"></div><div class="statusbar"><span id="listStatus">正在读取城市边界…</span><span id="savedStatus">自动保存</span></div>
    </aside>
    <main class="canvas">
      <div id="map" class="map" aria-label="中国城市探索地图"></div>
      <div class="canvas-head"><div class="canvas-label"><small>CURRENT VIEW</small><strong id="mapTitle">城市探索地图</strong></div><div class="view-switch" aria-label="地图层级"><button class="view-btn active" type="button" data-view="city">城市级</button><button class="view-btn" type="button" data-view="province">省级聚合</button></div></div>
      <div class="map-hint" id="mapHint">选择下方等级，再点击城市区块</div><div class="brush" id="brush" aria-label="地图涂色等级"></div>
    </main>
    <aside class="panel right-panel" aria-label="探索统计">
      <div class="panel-head"><div class="panel-title"><h2>探索概览</h2><p id="summaryCaption">省级颜色取省内最高探索等级</p></div></div>
      <div class="summary-scroll"><div class="stats-grid" id="statsGrid"></div><div class="section-title">等级说明</div><div class="legend-list" id="legendList"></div><div class="section-title">省级探索</div><div class="province-list" id="provinceList"></div></div>
    </aside>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script>
  (() => {
    'use strict';
    const LEVELS=[{name:'未到访',short:'未访',color:'#394352'},{name:'途经',short:'途经',color:'#aa91d8'},{name:'停留',short:'停留',color:'#4fb6e9'},{name:'游览',short:'游览',color:'#63c68b'},{name:'住宿',short:'住宿',color:'#e7cb60'},{name:'居住',short:'居住',color:'#e36d76'}];
    const STORAGE_KEY='travel-atlas-city-exploration-v1';
    const state={geo:null,seed:{},levels:{},view:'city',brush:3,map:null,layer:null,layerByCode:new Map(),selectedCode:'',search:'',province:''};
    const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const levelOf=code=>Math.max(0,Math.min(5,Number(state.levels[code])||0));
    const toast=msg=>{const el=$('#toast');el.textContent=msg;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),1800)};
    const save=()=>{localStorage.setItem(STORAGE_KEY,JSON.stringify(state.levels));$('#savedStatus').textContent='已保存';clearTimeout(save._t);save._t=setTimeout(()=>$('#savedStatus').textContent='自动保存',1300)};
    function provinceStats(){const grouped=new Map();state.geo.features.forEach(feature=>{const p=feature.properties,level=levelOf(p.code);if(!grouped.has(p.province))grouped.set(p.province,{name:p.province,total:0,explored:0,max:0,cities:[]});const row=grouped.get(p.province);row.total++;row.cities.push(p.code);if(level>0){row.explored++;row.max=Math.max(row.max,level)}});return [...grouped.values()].map(row=>({...row,score:row.max,level:row.max})).sort((a,b)=>b.max-a.max||b.explored-a.explored||a.name.localeCompare(b.name,'zh-CN'))}
    function provinceRow(name){return provinceStats().find(row=>row.name===name)}
    function featureStyle(feature){const p=feature.properties;let level=state.view==='province'?(provinceRow(p.province)?.level||0):levelOf(p.code);const selected=state.selectedCode===p.code;return{fillColor:LEVELS[level].color,fillOpacity:level ? .72 : .28,color:selected?'#fff':state.view==='province'?'#68758a':'#69768b',weight:selected?2.2:state.view==='province' ? .45 : .65,opacity:selected?1:.72}}
    function tooltipText(feature){const p=feature.properties;if(state.view==='city')return `<strong>${esc(p.name)}</strong><br>${esc(p.province)} · ${LEVELS[levelOf(p.code)].name}`;const row=provinceRow(p.province);return `<strong>${esc(p.province)}</strong><br>最高 ${row.level} · ${LEVELS[row.level].name} · 已探索 ${row.explored}/${row.total} 城市`}
    function applyLevel(code,level,announce=true){state.levels[code]=Number(level);state.selectedCode=code;save();refreshLayer();renderCityList();renderSummary();if(announce){const feature=state.geo.features.find(f=>f.properties.code===code);toast(`${feature?.properties.name||'城市'} · ${LEVELS[level].name}`)}}
    function refreshLayer(){if(!state.layer)return;state.layer.eachLayer(layer=>{layer.setStyle(featureStyle(layer.feature));layer.unbindTooltip().bindTooltip(tooltipText(layer.feature),{sticky:true,className:'city-tip'})})}
    function onFeature(feature,layer){const code=feature.properties.code;state.layerByCode.set(code,layer);layer.bindTooltip(tooltipText(feature),{sticky:true,className:'city-tip'});layer.on('click',()=>{if(state.view==='province'){state.province=feature.properties.province;$('#provinceFilter').value=state.province;state.view='city';syncViewButtons();renderCityList();refreshLayer();fitProvince(state.province);toast(`已打开${state.province}城市列表`);return}applyLevel(code,state.brush)})}
    function initMap(){state.map=L.map('map',{zoomControl:false,preferCanvas:true,minZoom:3,maxZoom:9}).setView([35.4,104.5],4);L.control.zoom({position:'bottomright'}).addTo(state.map);L.tileLayer('https://webrd04.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=7&x={x}&y={y}&z={z}',{maxZoom:18,attribution:'地图数据 © 高德地图'}).addTo(state.map);state.layer=L.geoJSON(state.geo,{style:featureStyle,onEachFeature:onFeature}).addTo(state.map);state.map.fitBounds(state.layer.getBounds(),{padding:[16,16]})}
    function renderBrush(){$('#brush').innerHTML='<span class="brush-label">地图涂色</span>'+LEVELS.map((level,index)=>`<button class="level-btn ${state.brush===index?'active':''}" type="button" data-level="${index}" style="--c:${level.color}" aria-pressed="${state.brush===index}"><i></i><span>${level.short}</span></button>`).join('');$$('#brush [data-level]').forEach(btn=>btn.onclick=()=>{state.brush=Number(btn.dataset.level);renderBrush();toast(`地图点击将设为“${LEVELS[state.brush].name}”`)})}
    function renderFilters(){const provinces=[...new Set(state.geo.features.map(f=>f.properties.province))].sort((a,b)=>a.localeCompare(b,'zh-CN'));$('#provinceFilter').innerHTML='<option value="">全部省份</option>'+provinces.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('')}
    function filteredFeatures(){const q=state.search.trim().toLocaleLowerCase('zh-CN');return state.geo.features.filter(feature=>{const p=feature.properties;return(!state.province||p.province===state.province)&&(!q||p.name.toLocaleLowerCase('zh-CN').includes(q)||p.province.toLocaleLowerCase('zh-CN').includes(q))}).sort((a,b)=>levelOf(b.properties.code)-levelOf(a.properties.code)||a.properties.name.localeCompare(b.properties.name,'zh-CN'))}
    function renderCityList(){const rows=filteredFeatures();$('#listStatus').textContent=`显示 ${rows.length} / ${state.geo.features.length} 个城市`;$('#cityList').innerHTML=rows.length?rows.map(feature=>{const p=feature.properties,level=levelOf(p.code);return `<div class="city-row ${state.selectedCode===p.code?'active':''}"><button class="city-name" type="button" data-focus="${p.code}" style="appearance:none;border:0;background:none;color:inherit;text-align:left;padding:0;cursor:pointer"><strong>${esc(p.name)}</strong><span>${esc(p.province)}</span></button><select class="city-level" data-city-level="${p.code}" aria-label="${esc(p.name)}探索等级">${LEVELS.map((item,index)=>`<option value="${index}" ${index===level?'selected':''}>${index} · ${item.name}</option>`).join('')}</select></div>`}).join(''):'<div class="empty">没有匹配的城市</div>';$$('[data-city-level]').forEach(select=>select.onchange=()=>applyLevel(select.dataset.cityLevel,Number(select.value)));$$('[data-focus]').forEach(btn=>btn.onclick=()=>focusCity(btn.dataset.focus))}
    function focusCity(code){const layer=state.layerByCode.get(code);if(!layer)return;state.selectedCode=code;refreshLayer();renderCityList();state.map.fitBounds(layer.getBounds(),{padding:[70,70],maxZoom:7});layer.openTooltip()}
    function fitProvince(name){const group=[];state.layer.eachLayer(layer=>{if(layer.feature.properties.province===name)group.push(layer)});if(group.length)state.map.fitBounds(L.featureGroup(group).getBounds(),{padding:[50,50],maxZoom:6})}
    function renderSummary(){const features=state.geo.features,explored=features.filter(f=>levelOf(f.properties.code)>0),totalLevel=features.reduce((sum,f)=>sum+levelOf(f.properties.code),0),provinces=provinceStats(),exploredProvinces=provinces.filter(p=>p.explored>0).length;$('#statsGrid').innerHTML=`<div class="stat-card"><div class="label">Explored cities</div><div class="value">${explored.length}<span class="unit">/ ${features.length}</span></div></div><div class="stat-card"><div class="label">Province coverage</div><div class="value">${exploredProvinces}<span class="unit">/ ${provinces.length}</span></div></div><div class="stat-card"><div class="label">Total level</div><div class="value">${totalLevel}<span class="unit">pts</span></div></div><div class="stat-card"><div class="label">Coverage</div><div class="value">${(explored.length/features.length*100).toFixed(1)}<span class="unit">%</span></div></div>`;$('#legendList').innerHTML=LEVELS.map((item,index)=>`<div class="legend-item" style="--c:${item.color}"><i class="legend-dot"></i><span>${index} · ${item.name}</span></div>`).join('');$('#provinceList').innerHTML=provinces.map(row=>`<button class="province-row" type="button" data-province="${esc(row.name)}"><span class="province-name">${esc(row.name)}<small>${row.explored} / ${row.total} 城市 · 覆盖 ${Math.round(row.explored/row.total*100)}%</small><span class="mini-bar" style="--c:${LEVELS[row.level].color}"><span style="width:${row.explored/row.total*100}%"></span></span></span><span class="province-score">${row.level} · ${LEVELS[row.level].short}</span></button>`).join('');$$('[data-province]').forEach(btn=>btn.onclick=()=>{state.province=btn.dataset.province;$('#provinceFilter').value=state.province;state.view='city';syncViewButtons();renderCityList();refreshLayer();fitProvince(state.province)})}
    function syncViewButtons(){$$('.view-btn').forEach(btn=>{const active=btn.dataset.view===state.view;btn.classList.toggle('active',active);btn.setAttribute('aria-pressed',active)});$('#mapTitle').textContent=state.view==='city'?'城市探索地图':'省级探索聚合图';$('#mapHint').textContent=state.view==='city'?'选择下方等级，再点击城市区块':'点击省份区块，进入该省城市列表';$('#brush').classList.toggle('hidden',state.view==='province')}
    function resetLevels(){if(!confirm('恢复为项目中现有的城市探索记录？本机修改将被覆盖。'))return;state.levels={...state.seed};localStorage.removeItem(STORAGE_KEY);refreshLayer();renderCityList();renderSummary();toast('已恢复现有探索记录')}
    function clearAllLevels(){if(!confirm('确定将全部城市的探索等级清空为 0 吗？可以随后使用恢复现有记录撤销。'))return;state.levels=Object.fromEntries(state.geo.features.map(feature=>[feature.properties.code,0]));state.selectedCode='';save();refreshLayer();renderCityList();renderSummary();toast('全部城市已归为 0 · 未到访')}
    function downloadText(name,text,type='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
    function csvCell(value){return '"'+String(value??'').replace(/"/g,'""')+'"'}
    function downloadTemplate(){const header=['城市','省份','代码','等级'],rows=state.geo.features.slice().sort((a,b)=>a.properties.province.localeCompare(b.properties.province,'zh-CN')||a.properties.name.localeCompare(b.properties.name,'zh-CN')).map(feature=>{const p=feature.properties;return[p.name,p.province,p.code,levelOf(p.code)]});downloadText('TravelAtlas_城市探索导入模板.csv',[header,...rows].map(row=>row.map(csvCell).join(',')).join('\r\n'));toast('模板已下载，可修改等级后直接导入')}
    function pickField(row,names){for(const name of names){if(row[name]!=null&&String(row[name]).trim()!=='')return row[name]}return ''}
    async function importFile(file){
      if(!file)return;
      try{
        let rows=[];
        if(file.name.toLowerCase().endsWith('.json')){
          const payload=JSON.parse(await file.text());
          if(Array.isArray(payload))rows=payload;else if(Array.isArray(payload.cities))rows=payload.cities;else if(payload.levels&&typeof payload.levels==='object')rows=Object.entries(payload.levels).map(([code,level])=>({代码:code,等级:level}));
        }else{
          if(!window.XLSX)throw Error('Excel 解析组件未加载');
          const workbook=XLSX.read(await file.arrayBuffer(),{type:'array'}),sheet=workbook.Sheets[workbook.SheetNames[0]];rows=XLSX.utils.sheet_to_json(sheet,{defval:'',raw:false});
        }
        if(!rows.length)throw Error('文件中没有可导入的城市记录');
        const byCode=new Map(state.geo.features.map(feature=>[feature.properties.code,feature]));
        const byName=new Map(state.geo.features.map(feature=>[`${feature.properties.province}|${feature.properties.name}`,feature]));
        const next={...state.levels};let matched=0,skipped=0;
        rows.forEach(row=>{
          let code=String(pickField(row,['代码','行政代码','code','Code'])??'').trim().replace(/\.0$/,'');if(code)code=code.padStart(6,'0');
          const city=String(pickField(row,['城市','城市名称','city','name'])??'').trim(),province=String(pickField(row,['省份','省','province'])??'').trim();
          let feature=byCode.get(code);if(!feature&&city&&province)feature=byName.get(`${province}|${city}`);if(!feature&&city){const candidates=state.geo.features.filter(item=>item.properties.name===city);if(candidates.length===1)feature=candidates[0]}
          let rawLevel=pickField(row,['等级','探索等级','level','Level']);if(String(rawLevel).trim()===''){const status=String(pickField(row,['状态','探索状态','status'])??'').trim();rawLevel=status==='下车'?2:LEVELS.findIndex(item=>item.name===status||item.short===status)}
          const level=Number(rawLevel);if(!feature||!Number.isInteger(level)||level<0||level>5){skipped++;return}next[feature.properties.code]=level;matched++;
        });
        if(!matched)throw Error('没有匹配到有效城市；请使用下载模板中的列名');
        state.levels=next;save();refreshLayer();renderCityList();renderSummary();toast(`已导入 ${matched} 个城市${skipped?`，跳过 ${skipped} 行`:''}`);
      }catch(error){toast(`导入失败：${error.message}`)}
    }
    function exportLevels(){const rows=state.geo.features.map(f=>({城市:f.properties.name,省份:f.properties.province,代码:f.properties.code,等级:levelOf(f.properties.code),状态:LEVELS[levelOf(f.properties.code)].name}));const blob=new Blob([JSON.stringify({version:1,updatedAt:new Date().toISOString(),cities:rows},null,2)],{type:'application/json;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='TravelAtlas_城市探索等级.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
    async function init(){try{const [geo,seed]=await Promise.all([fetch('data/china_city_boundaries.geojson').then(r=>r.ok?r.json():Promise.reject(Error(r.status))),fetch('data/city_exploration_seed.json').then(r=>r.ok?r.json():Promise.reject(Error(r.status)))]);state.geo=geo;state.seed=seed.levels||{};try{state.levels={...state.seed,...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch(_){state.levels={...state.seed}}renderFilters();renderBrush();renderCityList();renderSummary();initMap();syncViewButtons()}catch(error){$('#cityList').innerHTML=`<div class="empty">城市数据读取失败<br>${esc(error.message)}</div>`;$('#listStatus').textContent='数据不可用'}}
    $('#searchInput').addEventListener('input',event=>{state.search=event.target.value;renderCityList()});$('#provinceFilter').addEventListener('change',event=>{state.province=event.target.value;renderCityList();if(state.province)fitProvince(state.province)});$$('.view-btn').forEach(btn=>btn.onclick=()=>{state.view=btn.dataset.view;state.selectedCode='';syncViewButtons();refreshLayer();renderCityList()});const importInput=$('#importFileInput');$('#importBtn').onclick=()=>importInput.click();importInput.onchange=event=>{const file=event.target.files[0];event.target.value='';importFile(file)};$('#downloadTemplateBtn').onclick=downloadTemplate;$('#resetBtn').onclick=resetLevels;$('#clearAllBtn').onclick=clearAllLevels;$('#exportBtn').onclick=exportLevels;init();
  })();
  </script>
</body>
